# A pushed tag v* becomes a GitHub release once the module builds, its tests pass and
# the secret paths show no timing leak. A manual run only measures the timing.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ctcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Timing test
        run: go test -tags ctcheck -count=1 -timeout 60m -v ./internal/ctcheck

  release:
    needs: ctcheck
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the previous tag
          fetch-tags: true

      # checkout leaves the pushed tag lightweight, and its "contents" would be the commit message
      - name: Read the release notes from the tag annotation
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          message=$(git tag -l --format='%(contents)' "$TAG")
          if [ "$(git cat-file -t "$TAG")" != tag ] || [ -z "$message" ] || [ "$message" = "$TAG" ]; then
            echo "::error::$TAG needs an annotation with the release notes in Ukrainian"
            exit 1
          fi
          printf '%s\n' "$message" > notes.md

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test
        run: |
          go vet ./...
          go test -race ./...

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"
            exit 0
          fi

          # the commits are in English: the notes link to them instead of listing them
          previous=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          if [ -n "$previous" ]; then
            printf '\n**Повний список змін:** https://github.com/%s/compare/%s...%s\n' "$GITHUB_REPOSITORY" "$previous" "$TAG" >> notes.md
          fi

          gh release create "$TAG" --title "$TAG" --verify-tag --notes-file notes.md

      - name: Announce the version to the Go module proxy
        env:
          TAG: ${{ github.ref_name }}
        # pkg.go.dev picks the version up from proxy.golang.org; a failure here does not undo the release
        run: |
          cd "$(mktemp -d)" # outside the module: go list refuses a version of the main module
          GOPROXY=https://proxy.golang.org go list -m "github.com/${GITHUB_REPOSITORY}@${TAG}" || true
