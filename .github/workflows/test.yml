# Vet and race tests on every push to main and every pull request; the coverage goes to Codecov.
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  certification-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
      - name: Candidate profile with temporary secret erasure
        run: bash scripts/test-certification-profile.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test
        run: |
          go vet ./...
          go vet -tags ctcheck ./internal/ctcheck
          go test -race ./...

      - name: Test on 32-bit Go
        run: GOARCH=386 CGO_ENABLED=0 go test ./kalyna ./kupyna ./gost28147 ./gost34311 ./internal/spn ./dstu4145

      # apart from -race: both together take pki past the 10-minute test timeout
      - name: Coverage
        # -coverpkg counts internal/spn, which kalyna and kupyna test
        run: go test -coverpkg=./... -coverprofile=coverage.out ./...

      - uses: codecov/codecov-action@v5
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          # pull requests from forks get no secrets: only a push must upload
          fail_ci_if_error: ${{ github.event_name == 'push' }}
